version: 2
updates:
  # gomod + docker are handled by MintMaker (renovate.json) so they can be
  # batched and auto-merged. Dependabot only covers GitHub Actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "area/dependency"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
