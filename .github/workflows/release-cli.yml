name: Release CLI

# Explicit release: bump VERSION in the Makefile and merge to main.
# Lambda/runner live under cmd/ and internal/ too, so those paths are not
# a release signal — only a new VERSION is.
on:
  push:
    branches: [main]
    paths:
      - Makefile
      - .github/workflows/release-cli.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Read VERSION from Makefile
        id: version
        run: |
          version="$(make print-version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Detected VERSION: ${version}"

      - name: Check if GitHub Release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.tag }} already exists — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.tag }} is new — will publish binaries"
          fi

      - name: Build CLI binaries
        if: steps.check.outputs.exists == 'false'
        run: make dist

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          repo="${{ github.server_url }}/${{ github.repository }}"
          cat > /tmp/install-notes.md <<'NOTES'
          ## Install

          See [CLI Reference — Install](<REPO>/blob/<TAG>/docs/cli-reference.md#install)
          for download and checksum-verification instructions. Binaries and
          `SHA256SUMS` are attached below.
          NOTES
          sed -i "s|<REPO>|${repo}|g; s|<TAG>|${TAG}|g" /tmp/install-notes.md

          gh release create "$TAG" \
            --title "zoa CLI ${TAG}" \
            --target "${GITHUB_SHA}" \
            --generate-notes \
            --notes-file /tmp/install-notes.md \
            dist/zoa-* dist/SHA256SUMS
