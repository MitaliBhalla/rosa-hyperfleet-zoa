---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ImageRepository
metadata:
  annotations:
    image-controller.appstudio.redhat.com/update-component-image: "true"
  name: imagerepository-for-rosa-hyperfleet-zoa-zoa-lambda
  labels:
    appstudio.redhat.com/application: rosa-hyperfleet-zoa
    appstudio.redhat.com/component: zoa-lambda
spec:
  image:
    name: rosa-tenant/zoa-lambda
    visibility: public
  notifications:
    - config:
        url: https://bombino.api.redhat.com/v1/sbom/quay/push
      event: repo_push
      method: webhook
      title: SBOM-event-to-Bombino
