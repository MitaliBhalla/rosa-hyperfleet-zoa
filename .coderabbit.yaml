language: en-US
reviews:
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "cmd/**"
      instructions: |
        Review CLI commands for consistent UX patterns, proper error handling,
        and correct SigV4 authentication usage.
    - path: "internal/**"
      instructions: |
        Review internal packages for Go best practices, proper error wrapping,
        and clean separation of concerns between CLI commands and service logic.
    - path: "pkg/actions/**"
      instructions: |
        Review Trusted Action implementations for security: verify RBAC follows
        least-privilege, params are properly validated, timeout_seconds is
        reasonable, and the conformance test would pass (metadata, naming, RBAC).
    - path: "pkg/api/**"
      instructions: |
        Review API handlers for proper authentication, input validation,
        correct HTTP status codes, and no sensitive data leakage in responses.
    - path: "pkg/executor/**"
      instructions: |
        Review executor code for proper RBAC scoping, safe cleanup of ephemeral
        resources, no privilege escalation, and correct STS session policies.
    - path: "pkg/store/**"
      instructions: |
        Review DynamoDB operations for proper error handling, atomic transitions,
        and no sensitive data stored in plain text.
    - path: "pkg/scheduler/**"
      instructions: |
        Review reconciler and GC logic for idempotency, safe state transitions,
        and proper handling of edge cases (orphaned jobs, stale records).
    - path: "Containerfile*"
      instructions: |
        Review container images for minimal base images, no unnecessary tools,
        non-root execution, and proper layer caching.
chat:
  auto_reply: true
